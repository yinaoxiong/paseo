name: Personal Build
run-name: Personal Build ${{ inputs.marker }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional full SHA in approved personal/stable lineage; Android prototype branch must build its exact workflow commit.
        type: string
        default: ""
      revision:
        description: Personal revision 1–999 for the upstream stable base.
        type: string
        default: "1"
        required: true
      marker:
        description: Unique request marker (letters, digits, dot, dash, underscore).
        type: string
        required: true
      build_scope:
        description: Build packages, verify online CLI, build Android, or reverify an existing QA APK without compilation.
        type: choice
        options: [all, online-verify, android-only, android-qa-verify, android-delivery-only]
        default: all
        required: true
      npm_candidate_run_id:
        description: Optional earlier successful candidate build job to reverify without recompilation.
        type: string
        default: ""
      npm_candidate_manifest_sha256:
        description: Independently accepted exact npm batch manifest SHA256.
        type: string
        default: ""
      mac_archive_run_id:
        description: Optional successful personal build Run ID to reverify its existing Mac archive instead of rebuilding installers.
        type: string
        default: ""
      mac_archive_sha256:
        description: Independently accepted SHA-256 of that existing Mac archive.
        type: string
        default: ""
      android_qa_run_id:
        description: Completed Personal Build with a successful QA APK compilation job; overall Run may have failed native testing.
        type: string
        default: ""
      android_qa_manifest_sha256:
        description: Independently accepted SHA-256 of that Run's exact qa-build.json; use android-qa-verify only.
        type: string
        default: ""
      android_verified_run_id:
        description: Successful native QA Run whose exact report approves unchanged app inputs for ARM64 delivery only.
        type: string
        default: ""
      android_verified_report_sha256:
        description: Independently accepted SHA-256 of that Run's qa-runtime.json; use android-delivery-only.
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: personal-build-${{ inputs.marker }}
  cancel-in-progress: false
env:
  PASEO_BUILD_MARKER: ${{ inputs.marker }}
jobs:
  resolve:
    permissions:
      contents: read
      actions: read
    if: >-
      github.repository == 'yinaoxiong/paseo' && github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/personal/stable' ||
      (github.ref == 'refs/heads/integration/android-latex' && (inputs.build_scope == 'android-only' || inputs.build_scope == 'android-qa-verify' || inputs.build_scope == 'android-delivery-only')))
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      revision: ${{ steps.resolve.outputs.revision }}
      qa_payload_sha: ${{ steps.android_qa.outputs.qa_payload_sha }}
      qa_run_attempt: ${{ steps.android_qa.outputs.qa_run_attempt }}
      qa_artifact_id: ${{ steps.android_qa.outputs.qa_artifact_id }}
      delivery_binding_sha: ${{ steps.accepted_native_qa.outputs.binding_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
      - id: resolve
        env:
          PASEO_SOURCE_SHA: ${{ inputs.source_sha }}
          PASEO_PERSONAL_REVISION: ${{ inputs.revision }}
          PASEO_BUILD_SCOPE: ${{ inputs.build_scope }}
        run: node scripts/personal/resolve-source.mjs
      - name: Admit an existing candidate build when requested
        env:
          GH_TOKEN: ${{ github.token }}
          PASEO_SOURCE_SHA: ${{ steps.resolve.outputs.sha }}
          PASEO_BUILD_SCOPE: ${{ inputs.build_scope }}
          PASEO_NPM_CANDIDATE_RUN_ID: ${{ inputs.npm_candidate_run_id }}
          PASEO_NPM_CANDIDATE_MANIFEST_SHA256: ${{ inputs.npm_candidate_manifest_sha256 }}
          PASEO_MAC_ARCHIVE_RUN_ID: ${{ inputs.mac_archive_run_id }}
        run: node scripts/personal/resolve-npm-candidate.mjs
      - name: Admit an existing Android QA APK when requested
        id: android_qa
        env:
          GH_TOKEN: ${{ github.token }}
          PASEO_SOURCE_SHA: ${{ steps.resolve.outputs.sha }}
          PASEO_BUILD_SCOPE: ${{ inputs.build_scope }}
          PASEO_ANDROID_QA_RUN_ID: ${{ inputs.android_qa_run_id }}
          PASEO_ANDROID_QA_MANIFEST_SHA256: ${{ inputs.android_qa_manifest_sha256 }}
          PASEO_ANDROID_DELIVERY_QA_RUN_ID: ${{ inputs.android_verified_run_id }}
          PASEO_ANDROID_DELIVERY_QA_REPORT_SHA256: ${{ inputs.android_verified_report_sha256 }}
          PASEO_NPM_CANDIDATE_RUN_ID: ${{ inputs.npm_candidate_run_id }}
          PASEO_MAC_ARCHIVE_RUN_ID: ${{ inputs.mac_archive_run_id }}
          PASEO_NPM_CANDIDATE_MANIFEST_SHA256: ${{ inputs.npm_candidate_manifest_sha256 }}
          PASEO_MAC_ARCHIVE_SHA256: ${{ inputs.mac_archive_sha256 }}
        run: node scripts/personal/resolve-android-qa-candidate.mjs
      - name: Download accepted native QA proof
        if: inputs.build_scope == 'android-delivery-only'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: personal-android-native-qa
          path: .dev/android-delivery-input
          run-id: ${{ inputs.android_verified_run_id }}
          github-token: ${{ github.token }}
      - name: Prepare proof validation container
        if: inputs.build_scope == 'android-delivery-only'
        run: |
          npm install -g npm@11.19.0 @devcontainers/cli@0.87.0 --ignore-scripts --no-audit --no-fund
          node scripts/personal/prepare-ci-container.mjs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: inputs.build_scope == 'android-delivery-only'
        with:
          path: ${{ runner.temp }}/paseo-npm-cache
          key: personal-npm-linux-x64-node24.21.0-npm11.19.0-${{ hashFiles('package-lock.json') }}
      - id: accepted_native_qa
        name: Verify accepted native QA before signing admission
        if: inputs.build_scope == 'android-delivery-only'
        env:
          PASEO_BUILD_SCOPE: ${{ inputs.build_scope }}
          PASEO_PERSONAL_REVISION: ${{ steps.resolve.outputs.revision }}
          PASEO_ANDROID_DELIVERY_QA_RUN_ID: ${{ inputs.android_verified_run_id }}
          PASEO_ANDROID_DELIVERY_QA_REPORT_SHA256: ${{ inputs.android_verified_report_sha256 }}
          PASEO_ANDROID_DELIVERY_QA_SOURCE_SHA: ${{ steps.android_qa.outputs.qa_verified_source_sha }}
          PASEO_ANDROID_DELIVERY_QA_ARTIFACT_ID: ${{ steps.android_qa.outputs.qa_verified_artifact_id }}
          PASEO_ANDROID_DELIVERY_QA_ARTIFACT_DIGEST: ${{ steps.android_qa.outputs.qa_verified_artifact_digest }}
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          devcontainer up --workspace-folder "$GITHUB_WORKSPACE" --override-config "$RUNNER_TEMP/paseo-personal-ci-devcontainer.json" --mount-git-worktree-common-dir true
          devcontainer exec --workspace-folder "$GITHUB_WORKSPACE" --override-config "$RUNNER_TEMP/paseo-personal-ci-devcontainer.json" --mount-git-worktree-common-dir true --remote-env "PASEO_BUILD_SCOPE=$PASEO_BUILD_SCOPE" --remote-env "PASEO_PERSONAL_REVISION=$PASEO_PERSONAL_REVISION" --remote-env "PASEO_ANDROID_DELIVERY_QA_RUN_ID=$PASEO_ANDROID_DELIVERY_QA_RUN_ID" --remote-env "PASEO_ANDROID_DELIVERY_QA_REPORT_SHA256=$PASEO_ANDROID_DELIVERY_QA_REPORT_SHA256" --remote-env "PASEO_ANDROID_DELIVERY_QA_SOURCE_SHA=$PASEO_ANDROID_DELIVERY_QA_SOURCE_SHA" --remote-env "PASEO_ANDROID_DELIVERY_QA_ARTIFACT_ID=$PASEO_ANDROID_DELIVERY_QA_ARTIFACT_ID" --remote-env "PASEO_ANDROID_DELIVERY_QA_ARTIFACT_DIGEST=$PASEO_ANDROID_DELIVERY_QA_ARTIFACT_DIGEST" node scripts/personal/verify-android-qa-input.mjs .dev/android-delivery-input .dev/android-delivery-approval.json
          node --input-type=module -e 'import fs from "node:fs"; import {sha256,assertAndroidDeliveryBinding} from "./scripts/personal/android-qa-reverification.mjs"; const bytes=fs.readFileSync(".dev/android-delivery-approval.json"); const hash=sha256(bytes); assertAndroidDeliveryBinding(bytes,{targetSha:process.env.TARGET_SHA,revision:process.env.PASEO_PERSONAL_REVISION,deliveryRunId:process.env.GITHUB_RUN_ID,bindingHash:hash}); fs.appendFileSync(process.env.GITHUB_OUTPUT,"binding_sha="+hash+"\n");'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.build_scope == 'android-delivery-only'
        with:
          name: personal-android-qa-approval
          path: .dev/android-delivery-approval.json
          if-no-files-found: error
          retention-days: 14
  cli:
    if: inputs.mac_archive_run_id == '' && inputs.npm_candidate_run_id == '' && inputs.build_scope != 'android-only' && inputs.build_scope != 'android-qa-verify' && inputs.build_scope != 'android-delivery-only'
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
      - name: Prepare CLI and local cache
        run: |
          npm install -g npm@11.19.0 @devcontainers/cli@0.87.0 --ignore-scripts --no-audit --no-fund
          node scripts/personal/prepare-ci-container.mjs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/paseo-npm-cache
          key: personal-npm-linux-x64-node24.21.0-npm11.19.0-${{ hashFiles('package-lock.json') }}
      - run: devcontainer up --workspace-folder "$GITHUB_WORKSPACE" --override-config "$RUNNER_TEMP/paseo-personal-ci-devcontainer.json" --mount-git-worktree-common-dir true
      - env:
          REVISION: ${{ needs.resolve.outputs.revision }}
        run: devcontainer exec --workspace-folder "$GITHUB_WORKSPACE" --override-config "$RUNNER_TEMP/paseo-personal-ci-devcontainer.json" --mount-git-worktree-common-dir true npm run personal:cli -- --revision "$REVISION" --output-dir .local-build/personal-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-npm-candidates
          path: .local-build/personal-ci/*
          if-no-files-found: error
          retention-days: 14
  npm-install:
    permissions:
      contents: read
      actions: read
    if: ${{ !cancelled() && inputs.build_scope != 'android-only' && inputs.build_scope != 'android-qa-verify' && inputs.build_scope != 'android-delivery-only' && inputs.mac_archive_run_id == '' && needs.resolve.result == 'success' && (needs.cli.result == 'success' || inputs.npm_candidate_run_id != '') }}
    needs: [resolve, cli]
    env:
      PASEO_NPM_CANDIDATE_RUN_ID: ${{ inputs.npm_candidate_run_id }}
      PASEO_NPM_CANDIDATE_MANIFEST_SHA256: ${{ inputs.npm_candidate_manifest_sha256 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: macos-14
            target: macos-arm64
          - runner: windows-2025
            target: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
      - shell: bash
        run: npm install -g npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: personal-npm-candidates
          path: .local-build/npm-input
          run-id: ${{ inputs.npm_candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare Linux verification container without workspace dependencies
        if: runner.os == 'Linux'
        env:
          PASEO_NPM_VERIFY_ONLY: "true"
        run: |
          npm install -g @devcontainers/cli@0.87.0 --ignore-scripts --no-audit --no-fund
          node scripts/personal/prepare-ci-container.mjs
          devcontainer up --workspace-folder "$GITHUB_WORKSPACE" --override-config "$RUNNER_TEMP/paseo-personal-ci-devcontainer.json" --mount-git-worktree-common-dir true
      - name: Verify exact online candidates on Linux
        if: runner.os == 'Linux'
        run: devcontainer exec --workspace-folder "$GITHUB_WORKSPACE" --override-config "$RUNNER_TEMP/paseo-personal-ci-devcontainer.json" --mount-git-worktree-common-dir true npm run personal:validate:npm -- .local-build/npm-input .local-build/npm-proof/verification-npm-linux-x64.json
      - name: Verify exact online candidates on native Node
        if: runner.os != 'Linux'
        shell: bash
        run: npm run personal:validate:npm -- .local-build/npm-input .local-build/npm-proof/verification-npm-${{ matrix.target }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: personal-npm-proof-${{ matrix.target }}
          path: .local-build/npm-proof/*
          if-no-files-found: warn
          retention-days: 14
  desktop:
    if: inputs.mac_archive_run_id == '' && inputs.build_scope == 'all'
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: macos-arm64
          - runner: windows-2025
            target: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/personal-node
        with:
          desktop: "true"
      - shell: bash
        env:
          REVISION: ${{ needs.resolve.outputs.revision }}
        run: npm run personal:desktop -- "$REVISION" .local-build/personal-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-${{ matrix.target }}
          path: .local-build/personal-ci/*
          if-no-files-found: error
          retention-days: 14
  android-qa-build:
    if: inputs.mac_archive_run_id == '' && inputs.npm_candidate_run_id == '' && inputs.build_scope != 'online-verify' && inputs.build_scope != 'android-qa-verify' && inputs.build_scope != 'android-delivery-only'
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
      - name: Prepare QA builder resources
        run: |
          npm install -g npm@11.19.0 --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/paseo-android-npm" "$RUNNER_TEMP/paseo-android-gradle"
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo fallocate -l 16G "$RUNNER_TEMP/paseo-android.swap"
          sudo chmod 600 "$RUNNER_TEMP/paseo-android.swap"
          sudo mkswap "$RUNNER_TEMP/paseo-android.swap"
          sudo swapon "$RUNNER_TEMP/paseo-android.swap"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/paseo-android-npm
            ${{ runner.temp }}/paseo-android-gradle
          key: personal-android-qa-node24.21.0-${{ hashFiles('package-lock.json', 'docker/android-builder/Dockerfile') }}
      - run: npm run android:builder:image
      - name: Build signer-free Release Hermes QA APK
        env:
          PASEO_ANDROID_NPM_CACHE: ${{ runner.temp }}/paseo-android-npm
          PASEO_ANDROID_GRADLE_CACHE: ${{ runner.temp }}/paseo-android-gradle
        run: node scripts/personal/build-android-qa.mjs "${{ needs.resolve.outputs.revision }}" "$RUNNER_TEMP/android-qa"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-android-qa-x86_64
          path: ${{ runner.temp }}/android-qa/*
          if-no-files-found: error
          retention-days: 14
  android-qa:
    if: ${{ !cancelled() && needs.resolve.result == 'success' && inputs.mac_archive_run_id == '' && inputs.npm_candidate_run_id == '' && inputs.build_scope != 'online-verify' && (needs['android-qa-build'].result == 'success' || inputs.build_scope == 'android-qa-verify') }}
    needs: [resolve, android-qa-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    env:
      PASEO_BUILD_SCOPE: ${{ inputs.build_scope }}
      PASEO_ANDROID_QA_RUN_ID: ${{ inputs.android_qa_run_id }}
      PASEO_ANDROID_QA_MANIFEST_SHA256: ${{ inputs.android_qa_manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: personal-android-qa-x86_64
          path: .dev/android-qa-input
          run-id: ${{ inputs.android_qa_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare isolated fixture container
        env:
          PASEO_ANDROID_QA: "true"
        run: |
          npm install -g npm@11.19.0 @devcontainers/cli@0.87.0 --ignore-scripts --no-audit --no-fund
          node scripts/personal/prepare-ci-container.mjs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/paseo-npm-cache
          key: personal-npm-linux-x64-node24.21.0-npm11.19.0-${{ hashFiles('package-lock.json') }}
      - name: Start native QA fixture
        env:
          PASEO_BUILD_SCOPE: ${{ inputs.build_scope }}
          PASEO_PERSONAL_REVISION: ${{ needs.resolve.outputs.revision }}
          PASEO_ANDROID_QA_PAYLOAD_SHA: ${{ needs.resolve.outputs.qa_payload_sha }}
          PASEO_ANDROID_QA_RUN_ID: ${{ inputs.android_qa_run_id }}
          PASEO_ANDROID_QA_RUN_ATTEMPT: ${{ needs.resolve.outputs.qa_run_attempt }}
          PASEO_ANDROID_QA_MANIFEST_SHA256: ${{ inputs.android_qa_manifest_sha256 }}
        run: |
          devcontainer up --workspace-folder "$GITHUB_WORKSPACE" --override-config "$RUNNER_TEMP/paseo-personal-ci-devcontainer.json" --mount-git-worktree-common-dir true
          devcontainer exec --workspace-folder "$GITHUB_WORKSPACE" --override-config "$RUNNER_TEMP/paseo-personal-ci-devcontainer.json" --mount-git-worktree-common-dir true --remote-env "PASEO_BUILD_SCOPE=$PASEO_BUILD_SCOPE" --remote-env "PASEO_PERSONAL_REVISION=$PASEO_PERSONAL_REVISION" --remote-env "PASEO_ANDROID_QA_PAYLOAD_SHA=$PASEO_ANDROID_QA_PAYLOAD_SHA" --remote-env "PASEO_ANDROID_QA_RUN_ID=$PASEO_ANDROID_QA_RUN_ID" --remote-env "PASEO_ANDROID_QA_RUN_ATTEMPT=$PASEO_ANDROID_QA_RUN_ATTEMPT" --remote-env "PASEO_ANDROID_QA_MANIFEST_SHA256=$PASEO_ANDROID_QA_MANIFEST_SHA256" node scripts/personal/verify-android-qa-input.mjs .dev/android-qa-input .dev/android-qa-input/qa-verification-input.json
          devcontainer exec --workspace-folder "$GITHUB_WORKSPACE" --override-config "$RUNNER_TEMP/paseo-personal-ci-devcontainer.json" --mount-git-worktree-common-dir true sh -lc 'set -e; npm run build:server; cd packages/app; nohup node --import tsx e2e/mobile/android-release/fixture.ts > /tmp/paseo-qa-state/fixture.log 2>&1 < /dev/null & echo $! > /tmp/paseo-qa-state/fixture.pid'
          for attempt in $(seq 1 90); do
            if [ -f "$RUNNER_TEMP/paseo-qa-state/fixture-ready.json" ]; then break; fi
            sleep 2
          done
          test -f "$RUNNER_TEMP/paseo-qa-state/fixture-ready.json"
      - name: Install pinned Maestro
        run: |
          curl -fL --retry 2 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.11.0/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          printf '%s  %s\n' 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a "$RUNNER_TEMP/maestro.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise actual native Release UI
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node scripts/personal/smoke-android-release.mjs .dev/android-qa-input "$RUNNER_TEMP/paseo-qa-state" "$RUNNER_TEMP/android-qa-results"
      - name: Stop isolated fixture
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/paseo-qa-state/fixture.pid" ]; then
            devcontainer exec --workspace-folder "$GITHUB_WORKSPACE" --override-config "$RUNNER_TEMP/paseo-personal-ci-devcontainer.json" --mount-git-worktree-common-dir true sh -lc 'kill -TERM "$(cat /tmp/paseo-qa-state/fixture.pid)"; for attempt in $(seq 1 30); do test ! -f /tmp/paseo-qa-state/fixture-cleaned.json || exit 0; sleep 1; done; exit 1'
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: personal-android-native-qa
          path: |
            ${{ runner.temp }}/android-qa-results
            ${{ runner.temp }}/paseo-qa-state
          if-no-files-found: error
          retention-days: 14
  android:
    if: ${{ !cancelled() && needs.resolve.result == 'success' && inputs.mac_archive_run_id == '' && (((inputs.build_scope == 'all' || inputs.build_scope == 'android-only') && needs['android-qa'].result == 'success') || (inputs.build_scope == 'android-delivery-only' && needs['android-qa'].result == 'skipped' && needs.resolve.outputs.delivery_binding_sha != '')) }}
    needs: [resolve, android-qa]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
      - name: Download accepted native QA binding
        if: inputs.build_scope == 'android-delivery-only'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: personal-android-qa-approval
          path: .dev/android-delivery-proof
      - name: Validate accepted native QA binding
        if: inputs.build_scope == 'android-delivery-only'
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          REVISION: ${{ needs.resolve.outputs.revision }}
          BINDING_HASH: ${{ needs.resolve.outputs.delivery_binding_sha }}
        run: node --input-type=module -e 'import fs from "node:fs"; import {assertAndroidDeliveryBinding} from "./scripts/personal/android-qa-reverification.mjs"; assertAndroidDeliveryBinding(fs.readFileSync(".dev/android-delivery-proof/android-delivery-approval.json"),{targetSha:process.env.TARGET_SHA,revision:process.env.REVISION,deliveryRunId:process.env.GITHUB_RUN_ID,bindingHash:process.env.BINDING_HASH});'
      - name: Prepare dedicated builder
        run: |
          npm install -g npm@11.19.0 --ignore-scripts --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/paseo-android-npm" "$RUNNER_TEMP/paseo-android-gradle"
          # Dedicated builder contains Android/Java tooling; free duplicate runner tools.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          # Hermes can exceed physical RAM even without concurrent native compilation.
          sudo fallocate -l 16G "$RUNNER_TEMP/paseo-android.swap"
          sudo chmod 600 "$RUNNER_TEMP/paseo-android.swap"
          sudo mkswap "$RUNNER_TEMP/paseo-android.swap"
          sudo swapon "$RUNNER_TEMP/paseo-android.swap"
          free -h
          swapon --show
      - id: android-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/paseo-android-npm
            ${{ runner.temp }}/paseo-android-gradle
          key: personal-android-linux-x64-node24.21.0-${{ hashFiles('package-lock.json', 'docker/android-builder/Dockerfile') }}
      - name: Build dedicated image
        run: |
          npm run android:builder:image
      - name: Build and verify APK
        env:
          REVISION: ${{ needs.resolve.outputs.revision }}
          PASEO_ANDROID_KEYSTORE_B64: ${{ secrets.PASEO_ANDROID_KEYSTORE_B64 }}
          PASEO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PASEO_ANDROID_KEYSTORE_PASSWORD }}
          PASEO_ANDROID_NPM_CACHE: ${{ runner.temp }}/paseo-android-npm
          PASEO_ANDROID_GRADLE_CACHE: ${{ runner.temp }}/paseo-android-gradle
        run: |
          set -euo pipefail
          signing_dir=$(mktemp -d "$RUNNER_TEMP/paseo-signing.XXXXXX")
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$PASEO_ANDROID_KEYSTORE_B64" | base64 -d > "$signing_dir/key.p12"
          chmod 600 "$signing_dir/key.p12"
          unset PASEO_ANDROID_KEYSTORE_B64
          PASEO_ANDROID_KEYSTORE="$signing_dir/key.p12" npm run personal:android -- "$REVISION" .local-build/personal-ci
      - name: Bind ARM64 package to accepted native QA
        if: inputs.build_scope == 'android-delivery-only'
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          REVISION: ${{ needs.resolve.outputs.revision }}
          BINDING_HASH: ${{ needs.resolve.outputs.delivery_binding_sha }}
        run: node --input-type=module -e 'import fs from "node:fs"; import {androidDeliveryProvenance,sha256} from "./scripts/personal/android-qa-reverification.mjs"; const bytes=fs.readFileSync(".dev/android-delivery-proof/android-delivery-approval.json"); const manifest=JSON.parse(fs.readFileSync(".local-build/personal-ci/manifest-android-arm64.json","utf8")); const proof=androidDeliveryProvenance(bytes,manifest,{targetSha:process.env.TARGET_SHA,revision:process.env.REVISION,deliveryRunId:process.env.GITHUB_RUN_ID,bindingHash:process.env.BINDING_HASH}); const data=JSON.stringify(proof,null,2)+"\n"; const name="native-qa-approval-android-arm64.json"; fs.writeFileSync(".local-build/personal-ci/"+name,data,{flag:"wx"}); fs.writeFileSync(".local-build/personal-ci/"+name+".sha256",sha256(Buffer.from(data))+"  "+name+"\n",{flag:"wx"});'
      - name: Preserve dependency/toolchain downloads after a failed build
        if: always() && steps.android-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/paseo-android-npm
            ${{ runner.temp }}/paseo-android-gradle
          key: ${{ steps.android-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-android-arm64
          path: .local-build/personal-ci/*
          if-no-files-found: error
          retention-days: 14
  mac-archive-verification:
    if: inputs.mac_archive_run_id != '' && inputs.build_scope != 'android-only'
    needs: resolve
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/personal-node
      - name: Build smoke dependencies
        run: npm run build:server
      - name: Verify the existing final Mac archive
        env:
          GH_TOKEN: ${{ github.token }}
          PASEO_PERSONAL_REVISION: ${{ needs.resolve.outputs.revision }}
          PASEO_MAC_ARCHIVE_RUN_ID: ${{ inputs.mac_archive_run_id }}
          PASEO_MAC_ARCHIVE_SHA256: ${{ inputs.mac_archive_sha256 }}
          PASEO_MAC_ARCHIVE_DIR: ${{ runner.temp }}/mac-archive-input
          PASEO_MAC_VERIFICATION_OUTPUT: ${{ runner.temp }}/mac-archive-proof
        run: |
          gh run download "$PASEO_MAC_ARCHIVE_RUN_ID" --repo yinaoxiong/paseo --name personal-macos-arm64 --dir "$PASEO_MAC_ARCHIVE_DIR"
          node scripts/personal/verify-mac-archive.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-mac-archive-verification
          path: ${{ runner.temp }}/mac-archive-proof/*
          if-no-files-found: error
          retention-days: 14

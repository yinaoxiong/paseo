name: Personal npm Publish
run-name: Personal npm Publish ${{ inputs.marker }}
on:
  workflow_dispatch:
    inputs:
      marker:
        type: string
        required: true
        description: Unique publication request marker.
      confirmation:
        type: string
        required: true
        description: "PUBLISH @yinaoxiong 0.11.0-personal.1"
      auth_mode:
        type: choice
        options: [bootstrap, trusted]
        default: trusted
      packages:
        type: string
        default: '["protocol","client","plugin","server","cli"]'
        description: Pending package keys; omit only exact versions already verified in npm.
permissions:
  contents: read
concurrency:
  group: personal-npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'yinaoxiong/paseo' && github.ref == 'refs/heads/personal/stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PASEO_NPM_PACKAGES: ${{ inputs.packages }}
      PASEO_NPM_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.21.0"
          registry-url: https://registry.npmjs.org
      - name: Pin npm CLI
        env:
          NODE_AUTH_TOKEN: ""
        run: npm install -g npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: personal-npm-candidates
          path: .local-build/npm-publish-input
          run-id: "37776588373"
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: personal-npm-proof-linux-x64
          path: .local-build/npm-publish-input
          run-id: "37776588373"
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: personal-npm-proof-macos-arm64
          path: .local-build/npm-publish-input
          run-id: "37776588373"
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: personal-npm-proof-windows-x64
          path: .local-build/npm-publish-input
          run-id: "37776588373"
          github-token: ${{ github.token }}
      - name: Verify accepted build and files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/personal/verify-npm-release.mjs .local-build/npm-publish-input
          mkdir -p "$RUNNER_TEMP/paseo-npm-results"
      - name: Publish protocol
        id: publish_protocol
        if: contains(fromJSON(inputs.packages), 'protocol')
        env:
          NODE_AUTH_TOKEN: ${{ inputs.auth_mode == 'bootstrap' && secrets.PASEO_NPM_BOOTSTRAP_TOKEN || '' }}
        run: npm publish "./.local-build/npm-publish-input/yinaoxiong-paseo-protocol-0.11.0-personal.1.tgz" --ignore-scripts --access public --tag latest --provenance --json > "$RUNNER_TEMP/paseo-npm-results/protocol.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.publish_protocol.outcome != 'skipped'
        with:
          name: personal-npm-result-protocol-${{ inputs.marker }}
          path: ${{ runner.temp }}/paseo-npm-results/protocol.json
          if-no-files-found: warn
          retention-days: 90
      - name: Publish client
        id: publish_client
        if: contains(fromJSON(inputs.packages), 'client')
        env:
          NODE_AUTH_TOKEN: ${{ inputs.auth_mode == 'bootstrap' && secrets.PASEO_NPM_BOOTSTRAP_TOKEN || '' }}
        run: npm publish "./.local-build/npm-publish-input/yinaoxiong-paseo-client-0.11.0-personal.1.tgz" --ignore-scripts --access public --tag latest --provenance --json > "$RUNNER_TEMP/paseo-npm-results/client.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.publish_client.outcome != 'skipped'
        with:
          name: personal-npm-result-client-${{ inputs.marker }}
          path: ${{ runner.temp }}/paseo-npm-results/client.json
          if-no-files-found: warn
          retention-days: 90
      - name: Publish plugin
        id: publish_plugin
        if: contains(fromJSON(inputs.packages), 'plugin')
        env:
          NODE_AUTH_TOKEN: ${{ inputs.auth_mode == 'bootstrap' && secrets.PASEO_NPM_BOOTSTRAP_TOKEN || '' }}
        run: npm publish "./.local-build/npm-publish-input/yinaoxiong-paseo-plugin-0.11.0-personal.1.tgz" --ignore-scripts --access public --tag latest --provenance --json > "$RUNNER_TEMP/paseo-npm-results/plugin.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.publish_plugin.outcome != 'skipped'
        with:
          name: personal-npm-result-plugin-${{ inputs.marker }}
          path: ${{ runner.temp }}/paseo-npm-results/plugin.json
          if-no-files-found: warn
          retention-days: 90
      - name: Publish server
        id: publish_server
        if: contains(fromJSON(inputs.packages), 'server')
        env:
          NODE_AUTH_TOKEN: ${{ inputs.auth_mode == 'bootstrap' && secrets.PASEO_NPM_BOOTSTRAP_TOKEN || '' }}
        run: npm publish "./.local-build/npm-publish-input/yinaoxiong-paseo-server-0.11.0-personal.1.tgz" --ignore-scripts --access public --tag latest --provenance --json > "$RUNNER_TEMP/paseo-npm-results/server.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.publish_server.outcome != 'skipped'
        with:
          name: personal-npm-result-server-${{ inputs.marker }}
          path: ${{ runner.temp }}/paseo-npm-results/server.json
          if-no-files-found: warn
          retention-days: 90
      - name: Publish cli
        id: publish_cli
        if: contains(fromJSON(inputs.packages), 'cli')
        env:
          NODE_AUTH_TOKEN: ${{ inputs.auth_mode == 'bootstrap' && secrets.PASEO_NPM_BOOTSTRAP_TOKEN || '' }}
        run: npm publish "./.local-build/npm-publish-input/yinaoxiong-paseo-cli-0.11.0-personal.1.tgz" --ignore-scripts --access public --tag latest --provenance --json > "$RUNNER_TEMP/paseo-npm-results/cli.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.publish_cli.outcome != 'skipped'
        with:
          name: personal-npm-result-cli-${{ inputs.marker }}
          path: ${{ runner.temp }}/paseo-npm-results/cli.json
          if-no-files-found: warn
          retention-days: 90
